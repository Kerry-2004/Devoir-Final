<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie - XXL_FOURNITURE</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Ubuntu", sans-serif;
}
body{
    background-color: #fff;
}
header{
    padding: 20px 8%;;
}
section{
    padding: 70px 10%
}
header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}
.logo{
    font-weight: bold;
    font-size: 30px;
}
.logo-div{width: 30%;
}
.logo span{
    color:#247c60;
}
ul{
    display: flex;
    justify-content: center;

    width: 50% ;
    list-style: none;
}
ul li{
    padding: 10px 25px;
}
ul li a{
    text-decoration: none;
    color: #999;
    transition: 0.5s;
    font-size: 16px;
   
}
ul li a:hover {
background-color: #bfe7b4;
padding: 16px;
color: #000;
font-weight: bold;
border-radius: 17px;
}

.btn-header {
width: 30%;
display: flex;
justify-content: end;
}
.btn{
    color: #000;
    background-color:#247c60;
    border:2px solid #148d3a;
    padding: 15px 30px;
    border-radius: 20px;
    font-weight: bold;
    cursor:pointer;
    box-shadow: 5px 5px 30px rgba(0,0,0,0.1);
    transition: 0.5s;
}
.btn:hover{
    background-color: #f1f1f1;
    transform: rotate(5deg);
}
.btn i{
    margin-right: 5px;
}
.home-section{
    display:flex;
    justify-content: center;
    width: 100%;
}
.home-section.left{
    position: relative;
    height: 500px;
    width: 600px;

}
.home-section.left img {
    position: absolute;
    object-fit: cover;
    border: 8px solid #fff;
    box-shadow: 5px 5px 30px rgba(0,0, 0, 0.1);
    border-radius: 2rem;
}
.home-section .left-image-1{
    width: 450px;
    height: 500px;
    transition: 0.5s;
}
.home-section .left-img2{
    width: 350px;
    height: 350px;
    top: 150px;
    left: 250px;
    transition: 0.5s;
}
    .galerie-container {
      padding: 40px;
      background-color: #f5f5f5;
    }
    .galerie-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .galerie-grid img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
      transition: transform 0.3s ease;
    }

    .galerie-grid img:hover {
      transform: scale(1.05);
    }

    .video {
        margin-top: 30px;
      text-align: center;
    }

    .video iframe {
      width: 100%;
      max-width: 600px;
      height: 340px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

    <header class="hero">
      <h1>Galerie XXL_FOURNITURE</h1>
    </header>
  
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="galerie.html">Galerie</a></li>
        <li><a href="apropos.html">À propos</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="galerie-container">
    <h2>Nos Produits</h2>
    <div class="galerie-grid">
      <img src="image/image1.webp" alt="image 1">
      <img src="image/imge0.jpg" alt="image 2">
      <img src="image/image2.jpg" alt="image 3">
      <img src="image/image3.jpg" alt="image 4">
      <img src="image/image4.jpg" alt="image 5">
      <img src="image/image5.jpg" alt="image 6">
      <img src="image/image6.jpg" alt="image 7">
      <img src="image/image7.jpg" alt="image 8">
    </div>

    <div class="video">
      <h3>Présentation en vidéo</h3>
      <iframe src="video/PS5_Pro_799€_vs_PC_Gamer_799€_!__la_vérité_(360p).mp4" allowfullscreen></iframe>
    </div>
  </section>
  <footer>
    <p> 2025 XXL_FOURNITURE</p>
  </footer>

</body>
</html>
